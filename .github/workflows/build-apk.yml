name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create structure
        run: |
          mkdir -p app/src/main/java/com/mohlawan/mmrsportshub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cp MainActivity.java app/src/main/java/com/mohlawan/mmrsportshub/ || true
          cp activity_main.xml app/src/main/res/layout/ || true
          cp styles.xml app/src/main/res/values/ || true
          cp AndroidManifest.xml app/src/main/ || true
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { compileSdk 34
            defaultConfig { applicationId "com.mohlawan.mmrsportshub"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          EOF
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
      - name: Build
        run: |
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moh-Lawan-APK
          path: app/build/outputs/apk/debug/*.apk
